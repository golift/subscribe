version: "2"
linters:
  default: all
  disable:
    - wsl # deprecated.
    - exhaustruct # deprecated.
    - exhaustruct_v5 # constructors leave mu and optional fields at zero.
    - gomodguard # deprecated.
    - depguard # not useful.
    - testpackage # tests use unexported state.
  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - whyNoLint
        - commentedOutCode
      settings:
        unnamedResult:
          checkExported: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
